# Keeps the commit-SHA-pinned actions, Go modules, and the three package
# ecosystems current (readiness audit M-37). Actions are pinned to SHAs in
# the workflows; Dependabot updates the SHA and the trailing version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /gui
    schedule: { interval: weekly }
    groups:
      gui-deps: { patterns: ["*"] }
    ignore:
      # ESLint 10 removed context.getFilename, which the React plugin bundled
      # in eslint-config-next still calls ("react/display-name" fails to load).
      # Lift this once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: weekly }
  # Ecosystems that had no update config (review O-09). The vitest helper and
  # the framework recipes carried open critical advisories with no PR to fix
  # them.
  - package-ecosystem: npm
    directory: /sdk/vitest
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /sdk/npx
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /examples/frameworks/typescript
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /site
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
