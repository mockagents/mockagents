name: Candidate verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test ./... -count=1 -race -timeout 5m
      - if: runner.os == 'Windows'
        run: go test ./... -count=1 -timeout 5m
      - run: go build -o mockagents${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/mockagents
      - run: ./mockagents${{ runner.os == 'Windows' && '.exe' || '' }} validate examples/
      - if: runner.os != 'Windows'
        run: go run ./tools/driftcheck && go run ./tools/liquidcheck

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tenancy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PostgreSQL store and credential conformance
        env:
          MOCKAGENTS_TEST_PG_DSN: postgres://postgres:test@localhost:5432/tenancy?sslmode=disable
        run: go test ./internal/tenancy -count=1 -v

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/vitest/package-lock.json
            sdk/npx/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build pytest
      - run: python -m pytest sdk/python/tests
      - run: python -m build sdk/python
      - working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - working-directory: sdk/npx
        run: npm ci --no-audit --no-fund && npm test
      - working-directory: sdk/vitest
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - run: bash scripts/packed-js-consumer.test.sh

  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o mockagents ./cmd/mockagents
      - working-directory: gui
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high && npm run typecheck && npm test && npm run build
      - working-directory: gui
        run: npx playwright install --with-deps chromium
      - working-directory: gui
        run: npm run test:e2e
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Helm defaults, monitoring, and topology guards
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/mockagents
          helm lint deploy/helm/mockagents --values deploy/helm/mockagents/ci/test-values.yaml
          helm template verify deploy/helm/mockagents > /tmp/helm-defaults.yaml
          grep -q '^      enableServiceLinks: false$' /tmp/helm-defaults.yaml
          helm template verify deploy/helm/mockagents --values deploy/helm/mockagents/ci/test-values.yaml > /tmp/helm-ci.yaml
          grep -q '^      enableServiceLinks: false$' /tmp/helm-ci.yaml
          grep -q 'kind: ServiceMonitor' /tmp/helm-ci.yaml
          grep -q 'name: "mockagents-metrics"' /tmp/helm-ci.yaml
          grep -q 'key: "token"' /tmp/helm-ci.yaml
          if helm template reject deploy/helm/mockagents --set replicaCount=2 >/dev/null 2>&1; then exit 1; fi
          if helm template reject deploy/helm/mockagents --set replicaCount=2 --set env.MOCKAGENTS_TENANCY_DSN=postgres://x >/dev/null 2>&1; then exit 1; fi
          if helm template reject deploy/helm/mockagents --set autoscaling.enabled=true >/dev/null 2>&1; then exit 1; fi
          if helm template reject deploy/helm/mockagents --set serviceMonitor.enabled=true --set serviceMonitor.authorization.enabled=true >/dev/null 2>&1; then exit 1; fi
      - run: bash scripts/install-paths-report.test.sh
      - run: bash scripts/release-preflight.test.sh
      - run: bash scripts/release-workflow.test.sh
      - run: bash scripts/candidate-artifacts.test.sh
      - run: bash homelabsetup/tests/platform-key.test.sh

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag mockagents-candidate:${{ github.sha }} .
      - name: Exercise the candidate image
        run: |
          set -euo pipefail
          docker run -d --name mockagents-candidate -p 8080:8080 \
            -v "${{ github.workspace }}/examples:/agents:ro" \
            mockagents-candidate:${{ github.sha }}
          trap 'docker logs mockagents-candidate; docker rm -f mockagents-candidate' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8080/api/v1/health && exit 0
            sleep 1
          done
          exit 1
