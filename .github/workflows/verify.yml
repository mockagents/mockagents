name: Candidate verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1 -race -timeout 5m

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/vitest/package-lock.json
            sdk/npx/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build pytest
      - run: python -m pytest sdk/python/tests
      - run: python -m build sdk/python
      - working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - working-directory: sdk/npx
        run: npm ci --no-audit --no-fund && npm test
      - working-directory: sdk/vitest
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - run: bash scripts/packed-js-consumer.test.sh

  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - working-directory: gui
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint deploy/helm/mockagents && helm template verify deploy/helm/mockagents >/dev/null
      - run: bash scripts/install-paths-report.test.sh
      - run: bash scripts/release-preflight.test.sh
      - run: bash scripts/release-workflow.test.sh

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
