# Blocks a pull request that adds a dependency with a known High or Critical
# vulnerability, or one whose licence is incompatible with Apache-2.0
# (review O-26). Runs only on pull requests: it diffs the dependency graph.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A deny-list rather than an allow-list: the GUI's optional image
          # binaries (@img/sharp-libvips-*) are LGPL, which is fine for a
          # source-distributed console (review O-33), and an allow-list would
          # fail every Next.js bump on them. Strong copyleft stays out.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
