name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by job (readiness audit M-37): the pre-release test job
# needs read only; binaries need release (contents) write; the image job
# needs packages write. Nothing inherits both.
permissions:
  contents: read

# A retry of one tag resumes the same release; a second run cannot publish the
# same immutable versions concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  preflight:
    name: Release preflight
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      npm-channel: ${{ steps.version.outputs.npm-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate tag, package versions, peers and channel
        id: version
        run: bash scripts/release-preflight.sh "$GITHUB_REF_NAME"

      - name: Require the tagged commit on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release tag must point to a commit already on main"
            exit 1
          }

  prepare-artifacts:
    name: Prepare and inspect all artifacts
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.15.4"
          args: release --clean --skip=publish
      - run: python -m pip install --disable-pip-version-check build twine
      - run: |
          mkdir -p candidate/binaries candidate/python candidate/npm candidate/images
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt candidate/binaries/
          python -m build --outdir candidate/python sdk/python
          python -m twine check candidate/python/*
      - working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm run build && npm pack --pack-destination ../../candidate/npm
      - working-directory: sdk/vitest
        run: npm ci --no-audit --no-fund && npm run build && npm pack --pack-destination ../../candidate/npm
      - working-directory: sdk/npx
        run: npm ci --no-audit --no-fund && npm test && npm pack --pack-destination ../../candidate/npm
      - name: Build reusable platform images
        run: |
          docker buildx build --platform linux/amd64 --tag mockagents-candidate:${GITHUB_SHA}-amd64 --output type=docker,dest=candidate/images/linux-amd64.tar .
          docker buildx build --platform linux/arm64 --tag mockagents-candidate:${GITHUB_SHA}-arm64 --output type=docker,dest=candidate/images/linux-arm64.tar .
      - name: Record and scan exact candidate artifacts
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          mkdir candidate/inspect
          tar -xzf "candidate/binaries/mockagents_${{ needs.preflight.outputs.version }}_linux_amd64.tar.gz" -C candidate/inspect
          go version -m candidate/inspect/mockagents > candidate/binary-toolchain.txt
          govulncheck -mode=binary candidate/inspect/mockagents > candidate/binary-govulncheck.txt
          rm -rf candidate/inspect
          find candidate -type f ! -name SHA256SUMS ! -name candidate-manifest.txt -print0 \
            | sort -z | xargs -0 sha256sum > candidate/SHA256SUMS
          {
            echo "tag=${{ needs.preflight.outputs.tag }}"
            echo "version=${{ needs.preflight.outputs.version }}"
            echo "commit=${GITHUB_SHA}"
            echo "go_toolchain=$(sed -n 's/^toolchain //p' go.mod)"
            echo "goreleaser=v2.15.4"
            echo "govulncheck=v1.1.4"
          } > candidate/candidate-manifest.txt
          sha256sum candidate/SHA256SUMS candidate/candidate-manifest.txt >> candidate/SHA256SUMS.root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  publish-preflight:
    name: Verify publication configuration
    needs: [preflight, prepare-artifacts]
    runs-on: ubuntu-latest
    # Resolving this protected environment before the first mutation proves
    # that the PyPI publisher is configured and obtains any required approval.
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Require registry credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          STABLE: ${{ needs.preflight.outputs.stable }}
        run: |
          set -euo pipefail
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN NPM_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is not configured"; exit 1; }
          done
          if [[ "$STABLE" == true && -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for a stable release"
            exit 1
          fi

  release-binaries:
    name: Release Binaries
    needs: [preflight, prepare-artifacts, publish-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
      - name: Verify and publish prepared binary bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          STABLE: ${{ needs.preflight.outputs.stable }}
          EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
          EXPECTED_CANDIDATE_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_CANDIDATE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-candidate-artifacts.sh candidate
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "MockAgents ${TAG#v}")
            [[ "$STABLE" == true ]] || args+=(--prerelease)
            gh "${args[@]}"
          fi
          mkdir -p existing-release-assets
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in candidate/binaries/*.tar.gz candidate/binaries/*.zip \
            candidate/binaries/checksums.txt candidate/candidate-manifest.txt \
            candidate/binary-toolchain.txt candidate/binary-govulncheck.txt; do
            asset=${file##*/}
            if grep -qxF "$asset" <<< "$existing"; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir existing-release-assets
              cmp "$file" "existing-release-assets/$asset" || {
                echo "::error::existing immutable release asset differs: $asset"
                exit 1
              }
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

  release-docker:
    name: Release Docker Image
    needs: [preflight, prepare-artifacts, publish-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            mockagents/mockagents
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.stable }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.stable }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.stable }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push prepared image bytes and assemble channel manifests
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
          EXPECTED_CANDIDATE_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_CANDIDATE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-candidate-artifacts.sh candidate
          bash scripts/publish-candidate-images.sh

  verify-binary-assets:
    name: Verify published binary assets
    needs: [preflight, release-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download, checksum, and execute the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          (cd release-assets && sha256sum -c checksums.txt)
          tar -xzf release-assets/mockagents_${VERSION}_linux_amd64.tar.gz -C release-assets
          observed=$(release-assets/mockagents --version)
          [[ "$observed" == "mockagents version $VERSION" ]] || {
            echo "::error::published binary reports '$observed', expected $VERSION"; exit 1;
          }

  release-homebrew:
    name: Publish Homebrew cask from prepared archives
    if: needs.preflight.outputs.stable == 'true'
    needs: [preflight, prepare-artifacts, publish-preflight, verify-binary-assets]
    runs-on: ubuntu-latest
    concurrency:
      group: homebrew-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
      - name: Publish cask referencing exact GitHub archives
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
          EXPECTED_CANDIDATE_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_CANDIDATE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/verify-candidate-artifacts.sh candidate
          amd64="mockagents_${VERSION}_darwin_amd64.tar.gz"
          arm64="mockagents_${VERSION}_darwin_arm64.tar.gz"
          amd64_sha=$(awk -v file="$amd64" '$2 == file {print $1}' candidate/binaries/checksums.txt)
          arm64_sha=$(awk -v file="$arm64" '$2 == file {print $1}' candidate/binaries/checksums.txt)
          [[ -n "$amd64_sha" && -n "$arm64_sha" ]]
          gh repo clone mockagents/homebrew-tap tap
          mkdir -p tap/Casks
          cat > tap/Casks/mockagents.rb <<EOF
          cask "mockagents" do
            version "${VERSION}"
            on_arm do
              sha256 "${arm64_sha}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${arm64}"
            end
            on_intel do
              sha256 "${amd64_sha}"
              url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${amd64}"
            end
            name "MockAgents"
            desc "Mock OpenAI, Anthropic, Gemini, MCP and A2A APIs"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            binary "mockagents"
          end
          EOF
          cd tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Casks/mockagents.rb
          git diff --cached --quiet || git commit -m "mockagents ${VERSION}"
          git push origin HEAD:main

  release-python:
    name: Release Python SDK
    needs: [preflight, prepare-artifacts, publish-preflight, verify-binary-assets]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate

      - name: Verify prepared wheel and source distribution
        env:
          EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
          EXPECTED_CANDIDATE_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_CANDIDATE_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/verify-candidate-artifacts.sh candidate

      - name: Verify any already-published PyPI files
        run: python scripts/verify-pypi-candidate.py candidate/python "${{ needs.preflight.outputs.version }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: candidate/python/
          skip-existing: true

  release-npm:
    name: Release npm packages
    needs: [preflight, prepare-artifacts, publish-preflight, verify-binary-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify prepared package tarballs
        env:
          EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
          EXPECTED_CANDIDATE_TAG: ${{ needs.preflight.outputs.tag }}
          EXPECTED_CANDIDATE_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/verify-candidate-artifacts.sh candidate

      - name: Publish missing npm packages and verify existing bytes
        run: bash scripts/publish-candidate-npm.sh candidate/npm "${{ needs.preflight.outputs.npm-channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The post-release smoke test used to live here. It was removed because it
  # could not fail: it ran `docker pull ... || true` and then echoed "Release
  # artifacts published successfully" without verifying anything. It also
  # `needs:`-ed the three publish jobs, so on the v0.4.0 run — where all three
  # failed on missing credentials — it was SKIPPED rather than red, and the
  # release reported no actionable alarm while publishing almost nothing.
  #
  # Verification now lives in `install-paths.yml`, which runs on a schedule
  # against the PUBLIC registries and via `workflow_run` after this workflow
  # completes (including when it fails). Checking the registries rather than
  # this run's own outputs is the point: it is the only way to catch a publish
  # that silently no-opped, such as GoReleaser's `skip_upload` swallowing the
  # Homebrew tap push when HOMEBREW_TAP_TOKEN is unset.
