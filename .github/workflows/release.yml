name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by job (readiness audit M-37): the pre-release test job
# needs read only; binaries need release (contents) write; the image job
# needs packages write. Nothing inherits both.
permissions:
  contents: read

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./... -count=1 -race -timeout 5m

  release-binaries:
    name: Release Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned major: a floating "latest" GoReleaser could change the
          # release layout under a tag push with no review.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to mockagents/homebrew-tap. When unset the
          # value is empty and the Homebrew cask upload auto-skips (see
          # .goreleaser.yml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  release-docker:
    name: Release Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            mockagents/mockagents
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # This workflow only runs on v* tags, where is_default_branch is
            # never true, so :latest was never pushed and the README's
            # `docker run mockagents/mockagents` 404'd (readiness audit M-37).
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-python:
    name: Release Python SDK
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The PyPI wheel bootstraps the GitHub release binary whose version equals
      # the package version, so both pyproject.toml and the package __version__
      # must match the tag (mirrors the release-npm guard).
      - name: Verify package version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version' sdk/python/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          INIT=$(grep -m1 '__version__' sdk/python/mockagents/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          for v in "$PYPROJECT" "$INIT"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::sdk/python version $v does not match release tag $TAG"
              exit 1
            fi
          done
          echo "sdk/python versions == $TAG"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: sdk/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist/

  release-npm:
    name: Release npm packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The npx launcher and the SDK wrappers download the GitHub release binary
      # whose version equals their own package.json version, so a mismatch
      # between the tag and a package version would publish a wrapper that 404s.
      # Guard every publish on tag == package version.
      - name: Verify package versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in sdk/npx sdk/typescript sdk/vitest; do
            ver=$(node -p "require('./$pkg/package.json').version")
            if [ "$ver" != "$TAG" ]; then
              echo "::error::$pkg version $ver does not match release tag $TAG"
              exit 1
            fi
          done
          echo "all package versions == $TAG"

      # @mockagents/sdk (TypeScript SDK) — build then publish (scoped → public).
      - name: Publish @mockagents/sdk
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @mockagents/vitest (test-runner helper) — resolves @mockagents/sdk via a
      # local file: link at build time, so it does not need the SDK on npm yet.
      - name: Publish @mockagents/vitest
        working-directory: sdk/vitest
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # mockagents (npx launcher) — no build step; ships bin/lib only.
      - name: Publish mockagents (npx launcher)
        working-directory: sdk/npx
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The post-release smoke test used to live here. It was removed because it
  # could not fail: it ran `docker pull ... || true` and then echoed "Release
  # artifacts published successfully" without verifying anything. It also
  # `needs:`-ed the three publish jobs, so on the v0.4.0 run — where all three
  # failed on missing credentials — it was SKIPPED rather than red, and the
  # release reported no actionable alarm while publishing almost nothing.
  #
  # Verification now lives in `install-paths.yml`, which runs on a schedule
  # against the PUBLIC registries and via `workflow_run` after this workflow
  # completes (including when it fails). Checking the registries rather than
  # this run's own outputs is the point: it is the only way to catch a publish
  # that silently no-opped, such as GoReleaser's `skip_upload` swallowing the
  # Homebrew tap push when HOMEBREW_TAP_TOKEN is unset.
