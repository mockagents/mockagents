name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by job (readiness audit M-37): the pre-release test job
# needs read only; binaries need release (contents) write; the image job
# needs packages write. Nothing inherits both.
permissions:
  contents: read

# A retry of one tag resumes the same release; a second run cannot publish the
# same immutable versions concurrently.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  preflight:
    name: Release preflight
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      npm-channel: ${{ steps.version.outputs.npm-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate tag, package versions, peers and channel
        id: version
        run: bash scripts/release-preflight.sh "$GITHUB_REF_NAME"

      - name: Record immutable candidate identity
        run: |
          printf '%s\n' \
            "tag=${{ steps.version.outputs.tag }}" \
            "version=${{ steps.version.outputs.version }}" \
            "commit=${GITHUB_SHA}" \
            "stable=${{ steps.version.outputs.stable }}" \
            "go_toolchain=$(sed -n 's/^toolchain //p' go.mod)" > candidate-manifest.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest-${{ github.sha }}
          path: candidate-manifest.txt
          if-no-files-found: error

  prepare-artifacts:
    name: Prepare and inspect all artifacts
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m build sdk/python && python -m twine check sdk/python/dist/*
      - working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm run build && npm pack --dry-run
      - working-directory: sdk/vitest
        run: npm ci --no-audit --no-fund && npm run build && npm pack --dry-run
      - working-directory: sdk/npx
        run: npm ci --no-audit --no-fund && npm test && npm pack --dry-run
      - run: docker build --tag mockagents-candidate:${{ github.sha }} .

  release-binaries:
    name: Release Binaries
    needs: [preflight, prepare-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned major: a floating "latest" GoReleaser could change the
          # release layout under a tag push with no review.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to mockagents/homebrew-tap. When unset the
          # value is empty and the Homebrew cask upload auto-skips (see
          # .goreleaser.yml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PRERELEASE: ${{ needs.preflight.outputs.stable == 'false' }}

  release-docker:
    name: Release Docker Image
    needs: [preflight, prepare-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            mockagents/mockagents
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.stable }}
            type=semver,pattern={{major}},enable=${{ needs.preflight.outputs.stable }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.stable }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-python:
    name: Release Python SDK
    needs: [preflight, prepare-artifacts, release-binaries]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        working-directory: sdk/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist/

  release-npm:
    name: Release npm packages
    needs: [preflight, prepare-artifacts, release-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # @mockagents/sdk (TypeScript SDK) — build then publish (scoped → public).
      - name: Publish @mockagents/sdk
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm publish --access public --tag "${{ needs.preflight.outputs.npm-channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @mockagents/vitest (test-runner helper) — resolves @mockagents/sdk via a
      # local file: link at build time, so it does not need the SDK on npm yet.
      - name: Publish @mockagents/vitest
        working-directory: sdk/vitest
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm publish --access public --tag "${{ needs.preflight.outputs.npm-channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # mockagents (npx launcher) — no build step; ships bin/lib only.
      - name: Publish mockagents (npx launcher)
        working-directory: sdk/npx
        run: npm publish --tag "${{ needs.preflight.outputs.npm-channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The post-release smoke test used to live here. It was removed because it
  # could not fail: it ran `docker pull ... || true` and then echoed "Release
  # artifacts published successfully" without verifying anything. It also
  # `needs:`-ed the three publish jobs, so on the v0.4.0 run — where all three
  # failed on missing credentials — it was SKIPPED rather than red, and the
  # release reported no actionable alarm while publishing almost nothing.
  #
  # Verification now lives in `install-paths.yml`, which runs on a schedule
  # against the PUBLIC registries and via `workflow_run` after this workflow
  # completes (including when it fails). Checking the registries rather than
  # this run's own outputs is the point: it is the only way to catch a publish
  # that silently no-opped, such as GoReleaser's `skip_upload` swallowing the
  # Homebrew tap push when HOMEBREW_TAP_TOKEN is unset.
