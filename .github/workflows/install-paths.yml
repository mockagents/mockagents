name: Install paths

# Verifies that every install method the README advertises actually works,
# against the PUBLIC registries — not against build outputs.
#
# This exists because the v0.4.0 release run reported no actionable alarm while
# publishing almost nothing. Its post-release smoke test `needs:`-ed the publish
# jobs, so it was SKIPPED when they failed; it also ran `docker pull ... || true`
# and echoed "artifacts published successfully" without checking anything. A
# guard that cannot fail is not a guard.
#
# Design rules that follow from that:
#   1. Never depend on the release jobs. Run on a schedule, against registries.
#   2. Every check must be able to fail. No `|| true`, no unconditional echo.
#   3. Check ALL paths in one run, then decide — one run reports every breakage
#      rather than stopping at the first.
#   4. Known-unpublished paths live in .github/install-paths-pending.txt so the
#      expected state is reviewable in a diff. A pending path that STARTS
#      working also fails the run, because the README is then stale.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release tag to verify (for example v0.5.0)"
        required: false
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

env:
  REPO: mockagents/mockagents

jobs:
  target:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve one immutable release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          RELEASE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="$REQUESTED"
          if [[ -z "$tag" && "${{ github.event_name }}" == workflow_run ]]; then
            mapfile -t candidates < <(git tag --points-at "$RELEASE_RUN_SHA" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$' || true)
            [[ "${#candidates[@]}" -eq 1 ]] || { echo "expected one release tag for $RELEASE_RUN_SHA, found ${#candidates[@]}"; exit 1; }
            tag="${candidates[0]}"
            [[ "$(git rev-list -n 1 "$tag")" == "$RELEASE_RUN_SHA" ]] || { echo "release tag does not target workflow SHA"; exit 1; }
          fi
          if [[ -z "$tag" ]]; then
            tag=$(gh release list --repo "${{ github.repository }}" --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          fi
          # A completed prerelease must be verified too. Stable-only channels
          # (currently Homebrew) remain declared pending and therefore do not
          # make an otherwise complete prerelease look broken.
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]] || {
            echo "invalid release tag: $tag"; exit 1;
          }
          prerelease="${tag#*-}"
          if [[ "$tag" == *-* ]]; then
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              [[ ! "$identifier" =~ ^0[0-9]+$ ]] || { echo "invalid release tag: $tag"; exit 1; }
            done
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  linux:
    name: Check (Linux)
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Each check prints "<id>|<ok|fail>|<detail>" and always exits 0, so a
      # single run reports every path instead of halting at the first failure.
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.target.outputs.tag }}
          TARGET_VERSION: ${{ needs.target.outputs.version }}
        run: |
          set -uo pipefail
          out=results-linux.txt
          : > "$out"

          record() { printf '%s|%s|%s|%s\n' "$1" "$2" "$3" "$4" >> "$out"; }

          check() {   # check <id> <description> <command...>
            local id="$1" desc="$2"; shift 2
            echo "::group::$id — $desc"
            if observed=$(timeout 300 "$@" 2>/tmp/"$id".log); then
              # Keep the complete SemVer, including a prerelease suffix. The
              # old substitution reduced "mockagents version 0.5.0-rc.1" to
              # 0.5.0, so every exact-channel check failed for prereleases.
              observed=$(printf '%s\n' "$observed" \
                | grep -Eo '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?' \
                | tail -1)
              if [[ "$observed" == "$TARGET_VERSION" ]]; then status=ok; else status=fail; fi
              record "$id" "$status" "${observed:-none}" "$desc"
              echo "OK"
            else
              record "$id" fail none "$desc"
              echo "FAILED (exit $?)"
              tail -n 20 /tmp/"$id".log || true
            fi
            echo "::endgroup::"
          }

          # --- paths that must always work -------------------------------
          check go "go install from module proxy" \
            bash -c 'go install github.com/mockagents/mockagents/cmd/mockagents@"$TARGET_TAG" \
                     && "$(go env GOPATH)"/bin/mockagents --version'

          check binary "prebuilt binary from GitHub Releases" \
            bash -c 'rm -rf /tmp/relbin && mkdir -p /tmp/relbin \
                     && gh release download "$TARGET_TAG" --repo "$REPO" --pattern "*linux_amd64.tar.gz" --dir /tmp/relbin \
                     && tar -xzf /tmp/relbin/*linux_amd64.tar.gz -C /tmp/relbin \
                     && /tmp/relbin/mockagents --version'

          check go-sdk "go get the Go SDK" \
            bash -c 'cd "$(mktemp -d)" && go mod init probe >/dev/null \
                     && go get github.com/mockagents/mockagents/sdk/go/mockagents@"$TARGET_TAG" >/dev/null \
                     && go list -m -f "{{.Version}}" github.com/mockagents/mockagents'

          # --- paths pending publication ---------------------------------
          check docker-hub "docker run from Docker Hub" \
            docker run --rm "mockagents/mockagents:$TARGET_VERSION" --version

          check ghcr "docker run from GHCR" \
            docker run --rm "ghcr.io/mockagents/mockagents:$TARGET_VERSION" --version

          check npx "npx mockagents" \
            npx -y "mockagents@$TARGET_VERSION" --version

          check npm-sdk "npm @mockagents/sdk" \
            bash -c 'cd "$(mktemp -d)" && npm init -y >/dev/null && npm install --silent "@mockagents/sdk@$TARGET_VERSION" && node --input-type=module -e "await import(\"@mockagents/sdk\")" && printf "%s\n" "$TARGET_VERSION"'

          check npm-vitest "npm @mockagents/vitest" \
            bash -c 'cd "$(mktemp -d)" && npm init -y >/dev/null && npm install --silent "@mockagents/sdk@$TARGET_VERSION" "@mockagents/vitest@$TARGET_VERSION" vitest@2 && node --input-type=module -e "await import(\"@mockagents/vitest\"); await import(\"@mockagents/vitest/jest\")" && printf "%s\n" "$TARGET_VERSION"'

          check pipx "pipx run mockagents" \
            bash -c 'pip install --quiet pipx && pipx run "mockagents==$TARGET_VERSION" --version'

          check pypi "pip install mockagents" \
            bash -c 'python -m venv /tmp/probe-venv && /tmp/probe-venv/bin/pip install --quiet "mockagents==$TARGET_VERSION" && /tmp/probe-venv/bin/python -c "import mockagents; print(mockagents.__version__)"'

          echo "--- results ---"; cat "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-linux
          path: results-linux.txt

  macos:
    name: Check (macOS)
    needs: target
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Homebrew tap install
        run: |
          set -uo pipefail
          if timeout 600 brew install mockagents/tap/mockagents > /tmp/brew.log 2>&1 \
             && mockagents --version >> /tmp/brew.log 2>&1; then
            observed=$(mockagents --version \
              | grep -Eo '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?' \
              | tail -1)
            printf 'homebrew|ok|%s|brew install from tap\n' "$observed" > results-macos.txt
          else
            printf 'homebrew|fail|none|brew install from tap\n' > results-macos.txt
            tail -n 20 /tmp/brew.log || true
          fi
          cat results-macos.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-macos
          path: results-macos.txt

  report:
    name: Report
    needs: [target, linux, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8.0.0
        with:
          path: artifacts
          merge-multiple: true

      # `cat ... || true` is safe here only because the script treats a missing
      # or row-less results file as a hard failure — see its `rows` guard.
      - name: Summarise and gate
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          [[ "$LINUX_RESULT" == success && "$MACOS_RESULT" == success ]] || {
            echo "::error::Install check prerequisite failed: linux=$LINUX_RESULT macos=$MACOS_RESULT"
            exit 1
          }
          cat artifacts/results-*.txt > all.txt 2>/dev/null || true
          bash scripts/install-paths-report.sh \
            all.txt \
            .github/install-paths-pending.txt \
            .github/install-paths-required.txt \
            "${{ needs.target.outputs.version }}" \
            "$GITHUB_STEP_SUMMARY"
