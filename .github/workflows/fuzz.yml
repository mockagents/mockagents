name: Fuzz

# Native Go fuzzing (go test -fuzz) over the parsers that take untrusted
# input: the config validator, the provider wire adapters, SSE parsing, the
# tool-schema validator, and secret redaction. The seed corpora also run on
# every `go test ./...`; this workflow spends real fuzzing time on them.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/config
            target: FuzzValidateBytes
          - pkg: ./internal/adapter
            target: FuzzOpenAIChatCompletions
          - pkg: ./internal/adapter
            target: FuzzAnthropicMessages
          - pkg: ./internal/adapter
            target: FuzzGeminiGenerateContent
          - pkg: ./sdk/go/mockagents
            target: FuzzSSEStream
          - pkg: ./internal/recording
            target: FuzzAssembleSSEFrames
          - pkg: ./internal/recording
            target: FuzzRedactorApply
          - pkg: ./internal/toolschema
            target: FuzzValidate
          - pkg: ./internal/storage
            target: FuzzSanitizeBody
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target }}
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime 60s

      # A failing run writes the minimised crasher under the package's
      # testdata/fuzz/<Target>/. Upload it so it can be reproduced locally
      # with `go test <pkg> -run '<Target>/<file>'`.
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 30
