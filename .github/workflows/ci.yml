name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR,
# so rapid pushes don't stack up billable runner minutes (only the latest commit
# is ever fully tested).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux (1× billing, carries the race detector) + Windows (2×, the
        # cross-platform / no-cgo guard). macOS is intentionally omitted: at a
        # 10× minutes multiplier it dominated CI cost while adding little signal
        # for pure-Go code already covered by the Linux+Windows legs. Run the
        # full matrix locally on macOS if you touch OS-specific paths.
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      # The race detector needs CGO_ENABLED=1 + a C compiler. The Linux runner
      # always ships one, so it carries race coverage for the shared,
      # platform-independent code. The Windows leg runs the suite without -race
      # so the job never depends on whatever C toolchain happens to be on the
      # runner image (the build itself is pure-Go, no cgo).
      # See CONTRIBUTING.md "Race detection".
      - name: Run tests (race detector)
        if: runner.os != 'Windows'
        run: go test ./... -count=1 -race -timeout 5m

      - name: Run tests (no race — pure-Go, no cgo toolchain assumed)
        if: runner.os == 'Windows'
        run: go test ./... -count=1 -timeout 5m

      # Build to an OS-appropriate name and invoke that name. `-o mockagents`
      # writes an EXTENSIONLESS file on Windows, and PowerShell will not execute
      # one: `./mockagents validate examples/` produced no output, set no
      # $LASTEXITCODE, and let the step pass — so this leg validated nothing
      # from the day it was added while looking like it did. Linux carried the
      # check alone. Reproduced locally under pwsh before and after the fix.
      - name: Build binary
        run: go build -o mockagents${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/mockagents/

      - name: Validate examples
        run: ./mockagents${{ runner.os == 'Windows' && '.exe' || '' }} validate examples/

  # The tenancy Store has two backends (SQLite + Postgres). The matrix job above
  # exercises the SQLite leg everywhere; this Linux-only job spins up a real
  # Postgres service so the Store conformance suite's Postgres leg runs in CI
  # too (it is skipped without MOCKAGENTS_TEST_PG_DSN). Service containers only
  # work on Linux runners, hence the separate job.
  test-go-postgres:
    name: Go Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tenancy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Download dependencies
        run: go mod download
      - name: Store conformance against Postgres
        env:
          MOCKAGENTS_TEST_PG_DSN: postgres://postgres:test@localhost:5432/tenancy?sslmode=disable
        run: go test ./internal/tenancy/ -run TestStoreConformance -count=1 -v

  test-python:
    name: Python SDK Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The supported bookends only — 3.10 (min) and 3.13 (max). The SDK is
        # pure-Python with no version-specific code paths, so the intermediate
        # minors rarely diverge; testing the ends bounds the support range at
        # half the runner minutes.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK
        working-directory: sdk/python
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: sdk/python
        run: python -m pytest tests/ -v

      # examples/tests asserts the shape of the example documents themselves —
      # agent scenarios, and the Pipeline/TestSuite/MCPServer/A2AServer specs.
      # It ran nowhere in CI and quietly rotted to 16 failures, so it is gated
      # here. No extra install: pytest comes from the SDK's dev extra and pyyaml
      # is a runtime dependency, both from the step above.
      #
      # Autoload is off so the step depends only on pytest core — these are pure
      # YAML-shape assertions, and an unrelated pytest plugin that happens to be
      # installed should not be able to fail (or silently alter) this gate.
      - name: Run example fixture tests
        working-directory: examples
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/ -v

  # The RAG demo is a claim, not just a sample: "clone, one command, green in
  # under ten minutes". A demo nobody runs rots into a lie, so CI runs it the
  # same way its README tells a reader to — the binary from this checkout, the
  # SDK from this checkout, one `pytest`, no compose file and no ports.
  demo-rag:
    name: RAG demo (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the binary
        run: make build

      - name: Install the demo's dependencies
        working-directory: demo/rag-agent
        # requirements.txt names `mockagents` from PyPI, which is not published
        # yet; install the SDK from this checkout instead so the job tests THIS
        # tree rather than a release that does not exist.
        run: |
          pip install -e ../../sdk/python
          pip install openai mcp pytest pytest-asyncio

      - name: Run the demo suite
        working-directory: demo/rag-agent
        env:
          MOCKAGENTS_BIN: ${{ github.workspace }}/mockagents
        run: python -m pytest -v

  # Framework recipes (examples/frameworks) are executed, not just published, so
  # a recipe that stops working is a red build instead of a stale paragraph.
  #
  # One venv per framework, because they genuinely conflict: CrewAI pins
  # openai<3 and the OpenAI Agents SDK requires openai>=3, so installing both in
  # one environment silently downgrades one of them.
  framework-recipes:
    name: Framework recipe (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: openai-agents
            file: test_openai_agents.py
          - recipe: langgraph
            file: test_langgraph.py
          - recipe: crewai
            file: test_crewai.py
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the binary
        run: make build

      - name: Install ${{ matrix.recipe }}
        working-directory: examples/frameworks/python
        # The SDK comes from this checkout, not PyPI, so the job tests THIS tree.
        run: |
          pip install -r requirements-${{ matrix.recipe }}.txt
          pip install -e ../../../sdk/python

      - name: Run the recipe
        working-directory: examples/frameworks/python
        env:
          MOCKAGENTS_BIN: ${{ github.workspace }}/mockagents
        run: python -m pytest -v ${{ matrix.file }}

  framework-recipe-vercel:
    name: Framework recipe (Vercel AI SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build the binary
        run: make build

      - name: Install
        working-directory: examples/frameworks/typescript
        run: npm install

      - name: Run the recipe
        working-directory: examples/frameworks/typescript
        env:
          MOCKAGENTS_BIN: ${{ github.workspace }}/mockagents
        run: npm test

  # UX-08: the GUI delivery gate. Epic §10 is explicit that a green TypeScript
  # compile is not evidence of UX correctness, so this job runs four distinct
  # layers: types, production build, component interaction tests (jsdom) and
  # browser smoke tests driving the real Go server. Accessibility is asserted
  # in both test layers — jsdom covers names/roles/structure, and Chromium
  # covers the rules that need a real layout and cascade (colour contrast,
  # target size).
  gui:
    name: GUI (typecheck, build, component + browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # The browser suite runs against the real binary serving examples/ —
      # nothing in e2e/ is mocked, so an API contract change fails here.
      - name: Build server binary
        run: go build -o mockagents ./cmd/mockagents

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Typecheck
        working-directory: gui
        run: npm run typecheck

      - name: Production build
        working-directory: gui
        run: npm run build

      - name: Component + accessibility tests
        working-directory: gui
        run: npm test

      - name: Install Playwright browser
        working-directory: gui
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (real server)
        working-directory: gui
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: gui/playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Go vet
        run: go vet ./...

      - name: Go build (verify compilation)
        run: go build ./...

      # Fast guard (REF-06): every internal $ref in docs/api-spec.yaml must
      # resolve, and the license string must agree (Apache-2.0) across the
      # root LICENSE, both SDK manifests, and the OpenAPI info block. Fails
      # loudly on drift so a renamed component or a manifest regenerated back
      # to MIT can't slip in. The tool's own unit tests run in the Go job.
      #
      # It also compares each documented schema's field set against the Go type
      # that produces it, in both directions. A $ref check could not see that:
      # the references resolved perfectly while AgentSummary documented three
      # fields that had never existed and InteractionLog typed its id as a uuid.
      - name: API/SDK drift check
        run: go run ./tools/driftcheck

      # GitHub Pages builds docs/ with Jekyll, which runs Liquid before markdown
      # — so a literal `{{` in prose aborts the whole site build, backticks and
      # all. A failed Pages deploy raises no PR check, so that kept the published
      # site stale from 2026-07-27 until someone read the deploy log by hand,
      # while every PR in between showed green. This is that missing check.
      # The tool's own unit tests run in the Go job.
      - name: Docs Liquid check
        run: go run ./tools/liquidcheck

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t mockagents:ci-test .

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect mockagents:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 50 ]; then
            echo "Warning: Image size ${SIZE_MB}MB exceeds 50MB target"
          fi

      - name: Smoke test
        run: |
          docker run -d --name mockagents-test \
            -p 8080:8080 \
            -v ${{ github.workspace }}/examples:/agents:ro \
            mockagents:ci-test
          sleep 3
          curl -sf http://localhost:8080/api/v1/health
          docker stop mockagents-test
