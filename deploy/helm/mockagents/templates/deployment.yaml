{{- /*
Replica guard (readiness audit C-01). MockAgents keeps its agent registry,
conversation sessions, interaction log, audit log and per-tenant rate buckets
PER POD, and in multi-tenant mode with the default SQLite tenancy store every
pod would bootstrap its own "default" tenant and its own platform key. Behind
a round-robin Service that is split-brain: a key minted on one pod is a 401 on
the next. Running more than one replica is therefore refused unless the
operator explicitly acknowledges the remaining per-pod state and accepts the
documented routing and consistency limitations. A shared tenancy backend
(env.MOCKAGENTS_TENANCY_DSN) does not make the other stores shared and never
bypasses the acknowledgement.
*/ -}}
{{- $replicas := int .Values.replicaCount -}}
{{- if .Values.autoscaling.enabled -}}
{{- $replicas = int .Values.autoscaling.maxReplicas -}}
{{- end -}}
{{- if and (gt $replicas 1) (not .Values.multiReplica.acknowledged) -}}
{{- fail (printf "replicaCount/autoscaling.maxReplicas is %d but MockAgents keeps registry edits, sessions, interaction logs, audit logs and rate state per pod. A tenancy DSN shares credentials only and is not sufficient. Read the multi-replica limitations and set multiReplica.acknowledged=true to accept them explicitly." $replicas) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mockagents.fullname" . }}
  labels:
    {{- include "mockagents.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mockagents.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mockagents.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mockagents.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Rolling updates (audit M-34): kube-proxy removes the endpoint
      # asynchronously, so the preStop sleep keeps the pod serving while the
      # removal propagates; the server then gets SIGTERM and drains for up to
      # MOCKAGENTS_SHUTDOWN_TIMEOUT (20s default), all inside the grace period.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mockagents
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "mockagents.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.preStopSleepSeconds | quote }}]
          {{- end }}
          args:
            - start
            - --host
            - {{ .Values.host | quote }}
            - --port
            - "{{ .Values.service.port }}"
            - --agents-dir
            - /agents
            - --log-level
            - {{ .Values.logLevel | quote }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- /* The root filesystem is read-only; every SQLite store (interaction
                   log, audit log, tenancy) must live on the always-mounted /data
                   volume (audit H-10). Overridable through .Values.env. */}}
            {{- if not (hasKey .Values.env "MOCKAGENTS_DATA_DIR") }}
            - name: MOCKAGENTS_DATA_DIR
              value: /data
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/api/v1/health" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/api/v1/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: agents
              mountPath: /agents
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: agents
          configMap:
            name: {{ include "mockagents.agentsConfigMapName" . }}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "mockagents.fullname" .)) | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
