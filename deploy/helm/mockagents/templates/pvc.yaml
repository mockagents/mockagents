{{- /*
Chart-managed PersistentVolumeClaim for /data. Before this template existed,
persistence.size / accessModes / storageClass were declared in values.yaml but
never rendered: persistence.enabled=true without existingClaim silently gave an
emptyDir, so the audit and tenancy databases evaporated on every restart
(readiness audit C-01 / H-10).
*/ -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mockagents.fullname" . }}-data
  labels:
    {{- include "mockagents.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
