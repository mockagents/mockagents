# Exercised by `helm template` / `helm lint` to validate every template
# path: ingress enabled, inline agents, env vars, envFrom, extraArgs, and the
# acknowledged multi-replica path. PVC rendering is tested separately because
# one chart-managed claim cannot safely back multiple MockAgents pods.
image:
  repository: mockagents/mockagents
  tag: "0.5.0"

# Multi-replica paths are deliberately acknowledged. A tenancy DSN would not
# bypass this guard because the non-tenancy runtime state remains per pod.
replicaCount: 2
multiReplica:
  acknowledged: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mockagents.test.local
      paths:
        - path: /
          pathType: Prefix

agents:
  inline:
    echo.yaml: |
      apiVersion: mockagents/v1
      kind: Agent
      metadata:
        name: echo-agent
      spec:
        protocol: openai-chat-completions
        behavior:
          scenarios:
            - name: default
              response:
                content: "hello from helm"

persistence:
  enabled: false
  size: 2Gi
  storageClass: standard

env:
  MOCKAGENTS_LOG_LEVEL: debug
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4318

existingSecret: mockagents-secrets
extraEnvFrom:
  - configMapRef:
      name: mockagents-extra

extraArgs:
  - --json-logs

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

serviceMonitor:
  enabled: true
  authorization:
    enabled: true
    type: Bearer
    credentials:
      name: mockagents-metrics
      key: token
