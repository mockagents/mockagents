# Exercised by `helm template` / `helm lint` to validate every template
# path: ingress enabled, inline agents, chart-managed PVC, env vars,
# envFrom, extraArgs, and the acknowledged multi-replica path.
image:
  repository: mockagents/mockagents
  tag: "0.5.0"

# Two independent single-tenant mock servers behind the Service. Without
# the acknowledgement (or env.MOCKAGENTS_TENANCY_DSN) the chart refuses to
# render more than one replica — see templates/deployment.yaml.
replicaCount: 2
multiReplica:
  acknowledged: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mockagents.test.local
      paths:
        - path: /
          pathType: Prefix

agents:
  inline:
    echo.yaml: |
      apiVersion: mockagents/v1
      kind: Agent
      metadata:
        name: echo-agent
      spec:
        protocol: openai-chat-completions
        behavior:
          scenarios:
            - name: default
              response:
                content: "hello from helm"

persistence:
  enabled: true
  size: 2Gi
  storageClass: standard

env:
  MOCKAGENTS_LOG_LEVEL: debug
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4318

existingSecret: mockagents-secrets
extraEnvFrom:
  - configMapRef:
      name: mockagents-extra

extraArgs:
  - --json-logs
