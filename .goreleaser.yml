version: 2

project_name: mockagents

before:
  hooks:
    # Fail on an untidy go.mod rather than rewriting it mid-release, after the
    # tests ran against different inputs (review O-21).
    - go mod tidy -diff
    - go vet ./...
    # Licence and NOTICE text of every statically linked module, shipped in
    # each archive (review O-02).
    - go run ./tools/thirdpartynotices -o THIRD_PARTY_NOTICES.md

builds:
  - id: mockagents
    main: ./cmd/mockagents
    binary: mockagents
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible builds: no local paths in the binary, and file times taken
    # from the commit rather than the build clock.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - NOTICE
      - README*
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: mockagents
    name: mockagents
  draft: false
  prerelease: auto
  name_template: "MockAgents {{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
