# mockagents price table for the Agent Playground's model aliases. It powers
# cost_usd on GET /api/v1/logs and the GET /api/v1/costs rollup.
#
# The embedded mock loads this file automatically. For an external mockagents
# server, set:  MOCKAGENTS_PRICING=demo/agent-playground/config/mock-pricing.yaml
#
# LLM-tier aliases are priced like gpt-4o and SLM-tier aliases like gpt-4o-mini,
# so the cost dashboard shows what SLM routing saves. Keep these numbers in
# sync with the "pricing" block of config/playground.json.
prices:
  - { model: llm-planner,     prompt_per_1k_usd: 0.0025,  completion_per_1k_usd: 0.010 }
  - { model: llm-researcher,  prompt_per_1k_usd: 0.0025,  completion_per_1k_usd: 0.010 }
