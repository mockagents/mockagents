[pytest]
testpaths = tests
# The pytest plugin that ships with the mockagents SDK reads this to find the
# agent definitions it should serve, including the VectorCollection fixture.
mockagents_agents_dir = ./agents

# The app's retrieval path is async (the MCP client is), so the tests are too.
# Strict mode keeps the @pytest.mark.asyncio markers explicit.
asyncio_mode = strict
